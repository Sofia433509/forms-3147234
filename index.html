<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>FORMULARIO SENA V1</h1>
    <h3>Gracias por dejar sus datos</h3>

    <form id="survey-form" class="formulario">
      <label for="name">Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        required
        placeholder="Please enter your name"
      />
      <br />
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        placeholder="Please enter your email"
      />
      <br />
      <label for="age">Age:</label>
      <input
        type="number"
        id="age"
        name="age"
        required
        placeholder="Please enter your age"
      />

      <br />

      <label for="options">Choose an option:</label>
      <br />
      <select name="options" id="options">
        <option value="" disabled selected>Select one option</option>
        <option value="option1">Option 1</option>
        <option value="option2">Option 2</option>
        <option value="option3">Option 3</option>
      </select>

      <br />

      <label for="">Do you plan to buy a new car in the next 5 years?</label>
      <br />
      <input type="radio" id="yes" name="buyCar" value="yes" />
      <label for="yes">Yes</label>
      <br />
      <input type="radio" id="no" name="buyCar" value="no" />
      <label for="no">No</label>
      <br />
      <input type="radio" id="maybe" name="buyCar" value="maybe" />
      <label for="maybe">Maybe</label>

      <br />

      <label for="options">What is your favorite car brand:</label>
      <br />
      <select name="options" id="options">
        <option value="" disabled selected>Select one option</option>
        <option value="option1">Option 1</option>
        <option value="option2">Option 2</option>
        <option value="option3">Option 3</option>
      </select>

      <br />

      <label for="">What type of means of transportation do you own?</label>
      <br />
      <input type="checkbox" id="car" name="transport" value="car" />
      <label for="car">Car</label>
      <br />
      <input type="checkbox" id="boat" name="transport" value="boat" />
      <label for="boat">Boat</label>
      <br />
      <input type="checkbox" id="bicycle" name="transport" value="bicycle" />
      <label for="bicycle">Bicycle</label>
      <br />
      <input
        type="checkbox"
        id="motorcycle"
        name="transport"
        value="motorcycle"
      />
      <label for="motorcycle">Motorcycle</label>
      <br />
      <input type="checkbox" id="plane" name="transport" value="plane" />
      <label for="plane">Plane</label>
      <br />
      <input type="checkbox" id="bike" name="transport" value="bike" />
      <label for="bike">Bike</label>

      <br />

      <label for="comments">Any comments suggestions:</label>
      <br />
      <textarea id="comments" name="comments" rows="4" cols="50"></textarea>

      <br />

      <input type="submit" value="Submit" />
    </form>

    <div id="modal-success" class="modal hidden">

        <div class="modal-content">
            <h2>Datos enviados con exito!</h2>
            <br>
            <button class="close-modal">Cerrar</button>
        </div>

    </div>


    <script type="module" src="main.js"></script>
  </body>
</html>
