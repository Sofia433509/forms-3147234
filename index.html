<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULARIO</title>
</head>
<body>
    <h1>Formulario</h1>
    <h2>Gracias por dejar sus datos</h2>

    <form action="">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required><br><br>

        <label for="options">Choose an option:</label>
        <select id="options" name="options">
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
        </select><br><br>

        <label for="">Do you plan to buy a new car in the next 5 years?</label>
        <br>

        <input type="radio" id="yes" name="car" value="yes">
        <label for="yes">Yes</label>
        <br>
        <input type="radio" id="no" name="car" value="no">
        <label for="no">No</label>
        <br>
        <input type="radio" id="maybe" name="car" value="maybe">
        <label for="maybe">Maybe</label>

        <br>
        <br>
        <label for="options">What is your favorite car brand?</label>
        <br>
        <select id="options" name="options">
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
        </select>
        
        <br>
        <br>

        <label for="">What type of means of transportation do you own?</label>
        <br>
        <input type="checkbox" id="car" name="transportation" value="car">
        <label for="car">Car</label>
        <br>
        <input type="checkbox" id="boat" name="transportation" value="boat">
        <label for="boat">Boat</label>
        <br>
        <input type="checkbox" id="bicycle" name="transportation" value="bicycle">
        <label for="bicycle">Bicycle</label>
        <br>
        <input type="checkbox" id="motorcycle" name="transportation" value="motorcycle">
        <label for="motorcycle">Motorcycle</label>
        <br>
        <input type="checkbox" id="plane" name="transportation" value="plane">
        <label for="plane">Plane</label>
        <br>
        <input type="checkbox" id="bike" name="transportation" value="bike">
        <label for="bike">Bike</label>

        <br>
        <br>

        <label for="comments">Any comments suggestions?</label>
        <br>
        <textarea id="comments" name="comments" rows="4" cols="50"></textarea>

        <br>
        <br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
